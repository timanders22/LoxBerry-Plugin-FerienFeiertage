; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Ferien und Feiertage"
K02 = "Liefert <b>Schulferien und gesetzliche Feiertage</b> an Loxone — automatisch, ohne jährliches Nachpflegen von Terminlisten. Damit lassen sich Wecker, Morgen-Briefing, Rollladen- und Heizzeiten an freie Tage anpassen."
K03 = "Datenquelle: <b>openholidaysapi.org</b> (amtliche Daten, kostenlos, kein Konto). Unterstützt Deutschland, Österreich, Schweiz und weitere Länder mit ihren Bundesländern/Kantonen."
K04 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K05 = "Funktionen"
K06 = "<b>Heute und morgen</b> getrennt ausgewertet: Ferien, Feiertag, Wochenende, schulfrei, Schultag"
K07 = "<b><code>MSCHULTAG</code></b> — „morgen ist Schultag“: der Schlüsselwert für Wecker- und Abendlogik, ohne den man Ferien immer zu spät bemerkt"
K08 = "<b>Brückentage</b> werden erkannt (Werktag zwischen Feiertag und Wochenende) — inklusive Jahresübersicht im Januar, gut für die Urlaubsplanung"
K09 = "<b>Countdown</b>: Tage bis zu den nächsten Ferien, verbleibende Ferientage, Tage bis zum nächsten Feiertag, Name des laufenden Feiertags/der Ferien"
K10 = "<b>Arbeitsort/Gemeinde</b> für die drei Feiertage, die nicht im ganzen Bundesland gelten: Friedensfest (nur Stadt Augsburg), Mariä Himmelfahrt (in Bayern nur in den ~1.700 überwiegend katholischen Gemeinden) und Fronleichnam (in Sachsen und Thüringen nur in bestimmten katholischen Gemeinden). Die Datenquelle kennt davon nur Augsburg — die beiden anderen Fälle rechnet das Plugin selbst (Fronleichnam über das Osterdatum + 60 Tage)"
K11 = "<b>Eigene Termine</b> (bis zu 6): Betriebsferien, Urlaub, schulfreie Tage — wahlweise „wie Ferien“, „wie Feiertag“ oder <b>„Urlaub (abwesend)“</b>"
K12 = "<b>Urlaubsmodus</b>: Termine der Art „Urlaub (abwesend)“ liefern zusätzlich <code>URLAUB</code>, <code>MURLAUB</code>, <code>URLAUBIN</code>, <code>URLAUBREST</code>, <code>URLAUBDAUER</code> und <code>URLAUBENDE</code>. Damit fährt die Haussteuerung automatisch in den Urlaubsmodus (Anwesenheitssimulation, Temperaturabsenkung, Steckdosen aus) und hebt ihn am letzten Urlaubstag rechtzeitig wieder auf, damit das Haus zur Rückkehr warm ist"
K13 = "<b>Vorabend-Ansage</b> (TTS) „Morgen ist schulfrei“ und Push-Auslöser für Loxone"
K14 = "<b>MQTT</b> über das LoxBerry MQTT Gateway, <b>JSON</b> für Drittsoftware"
K15 = "Daten für 18 Monate im Voraus, lokal gespeichert (läuft auch ohne Internet weiter), automatisches Nachladen vor dem Auslaufen — kein Jahreswechsel-Problem"
K16 = "Reiter: Einstellungen, Einbindung in Loxone (Schritt-für-Schritt inkl. kompletter Baustein-Liste), Brückentage, Kommende Ferien, Kommende Feiertage, Test, Protokoll"
K17 = "Endpunkte"
K18 = "Datenschutz"
K19 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Alle Einstellungen liegen lokal (<code>config/plugins/ferien/ferien.json</code>). Externe Verbindungen gibt es ausschließlich zur öffentlichen OpenHolidays-API (ohne Kennung)."
K20 = "Aufruf"
K21 = "Zweck"
K22 = "<code>/plugins/ferien/ferien.php</code>"
K23 = "Loxone-Zeile <code>FERIEN;OK=..;SCHULTAG=..;MSCHULTAG=..;BRUECKE=..;FERIENIN=..;URLAUB=..;URLAUBENDE=..;…</code>"
K24 = "<code>/plugins/ferien/ferien.php?debug=1</code>"
K25 = "Ferien-, Feiertags- und Brückentagsliste im Klartext"
K26 = "<code>/plugins/ferien/ferien.php?refresh=1</code>"
K27 = "Daten sofort neu abrufen"
K28 = "<code>/plugins/ferien/ferien.php?json=1</code>"
K29 = "kompletter Zustand als JSON"
K30 = "<code>/plugins/ferien/ferien.php?say=1&amp;token=...</code>"
K31 = "Test-Ansage"
K32 = "<code>/plugins/ferien/ferien.php?ptest=1&amp;token=...</code>"
K33 = "Test-Pushnachricht auslösen"
