; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "School holidays and public holidays"
K02 = "Supplies <b>school holidays and public holidays</b> to Loxone — automatically, without maintaining date lists every year. That lets you adapt alarm clocks, the morning briefing, blind and heating schedules to days off."
K03 = "Data source: <b>openholidaysapi.org</b> (official data, free of charge, no account). Supports Germany, Austria, Switzerland and further countries with their federal states and cantons."
K04 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K05 = "Features"
K06 = "<b>Today and tomorrow</b> evaluated separately: holidays, public holiday, weekend, no school, school day"
K07 = "<b><code>MSCHULTAG</code></b> — „tomorrow is a school day“: the key value for alarm-clock and evening logic, without which you always notice the holidays too late"
K08 = "<b>Bridge days</b> are detected, either classically (a working day directly between a public holiday and a weekend) or in extended mode — which also finds the working days between Christmas and New Year that the classic rule misses entirely. Including a yearly overview in January, useful for planning leave"
K09 = "<b>Countdown</b>: days until the next holidays, remaining holiday days, days until the next public holiday, name of the current public holiday or holiday period"
K10 = "<b>Place of work / municipality</b> for the three public holidays that do not apply across the whole federal state: Friedensfest (Augsburg only), Assumption Day (in Bavaria only in the roughly 1,700 predominantly Catholic municipalities) and Corpus Christi (in Saxony and Thuringia only in certain Catholic municipalities). Of these the data source only knows Augsburg — the plugin works out the other two itself (Corpus Christi from the date of Easter + 60 days)"
K11 = "<b>Your own dates</b> (up to 6): company holidays, leave, days off school — either „like holidays“, „like a public holiday“ or <b>„leave (away)“</b>"
K12 = "<b>Away mode</b>: dates of the kind „leave (away)“ additionally supply <code>URLAUB</code>, <code>MURLAUB</code>, <code>URLAUBIN</code>, <code>URLAUBREST</code>, <code>URLAUBDAUER</code> and <code>URLAUBENDE</code>. With those the house control moves into away mode automatically (presence simulation, lower temperature, sockets off) and lifts it again in good time on the last day of leave, so that the house is warm when you return"
K13 = "<b>Evening announcement</b> (TTS) „no school tomorrow“ and a push trigger for Loxone"
K14 = "<b>MQTT</b> through the LoxBerry MQTT gateway, <b>JSON</b> for third-party software"
K15 = "Data for 18 months ahead, stored locally (keeps working without internet), reloaded automatically before it expires — no turn-of-the-year problem"
K16 = "Tabs: Settings, MQTT, Loxone integration (step by step including a complete list of blocks), Bridge days, Upcoming holidays, Upcoming public holidays, Test, Log"
K17 = "Endpoints"
K18 = "Privacy"
K19 = "The plugin contains <b>no personal data</b>. All settings are kept locally (<code>config/plugins/ferien/ferien.json</code>). The only external connection is to the public OpenHolidays API (without any identifier)."
K20 = "Call"
K21 = "Purpose"
K22 = "<code>/plugins/ferien/ferien.php</code>"
K23 = "Loxone line <code>FERIEN;OK=..;SCHULTAG=..;MSCHULTAG=..;BRUECKE=..;FERIENIN=..;URLAUB=..;URLAUBENDE=..;…</code>"
K24 = "<code>/plugins/ferien/ferien.php?debug=1</code>"
K25 = "Holiday, public holiday and bridge day list in plain text"
K26 = "<code>/plugins/ferien/ferien.php?refresh=1</code>"
K27 = "Fetch the data again immediately"
K28 = "<code>/plugins/ferien/ferien.php?json=1</code>"
K29 = "complete state as JSON"
K30 = "<code>/plugins/ferien/ferien.php?say=1&amp;token=...</code>"
K31 = "Test announcement"
K32 = "<code>/plugins/ferien/ferien.php?ptest=1&amp;token=...</code>"
K33 = "Trigger a test push message"
K34 = "<b><code>FREITAGE</code></b> — how many days off in a row start today. This is the value that tells a weekend (2 days) apart from the summer holidays (45 days), and therefore the only one a heating setback can sensibly be based on. Together with <code>FERIENENDE</code>, <code>MERSTERSCHULTAG</code> and <code>URLAUBHEIM</code> for the transitions."
K35 = "<b>Two regions and type of school</b>: a second federal state for school holidays only, for a household with children at schools in different states. Public holidays are deliberately fetched only once: they depend on where you live, not on which school you attend."
K36 = "<b>Appointments from a calendar</b> (an ICS subscription from Google, Nextcloud or iCloud) instead of the six hand-maintained rows. All-day events are used; timed and repeating events are left out, because the plugin works in whole days."
K37 = "<b>Self-check</b> on the Test tab: answers without Loxone whether the setup holds. It really calls the plugin endpoint and verifies that no field in the output line hides another. A mere note deliberately does not count as passed."
