[MQTT]

HAUS_HAKEN = "Give calendar days to other plugins (haus/kalender/…)"
HAUS_WIRKT = "Off by default. Only works with “Publish state via MQTT”."
HAUS_HINWEIS = "Numbers only (public holiday, rest day, free, holiday for today and tomorrow, days until holidays/public holiday), never names. Only one Ferien plugin in the house is the provider. Read by: Sprachsteuerung (“Ist morgen schulfrei?”, off there by default); later Robonect, Saugroboter, Bewässerung. The days until the holidays include own appointments of the type “Ferien” and “Urlaub” (like ferien_ferien_in). Sent via a short connection directly to the broker; when switched off the topics are cleared there again. Whoever wants to see the values in Loxone ticks them in the MQTT gateway – not necessary, the line topics ferien/… carry the same values."
HAUS_M_GELEERT = "House topics haus/kalender: %d topics cleared (confirmed by the broker)."
HAUS_M_NICHTS = "House topics haus/kalender: nothing to clear – the broker retains none of the topics."
HAUS_M_REST = "House topics haus/kalender: still retained (%s) – the minute run and the uninstall clear once more."
HAUS_M_KEIN_BROKER = "House topics haus/kalender: broker not reachable – the minute run and the uninstall clear later."
HAUS_T_TITEL = "House topics (other plugins)"
HAUS_T_AUS = "Calendar days to other plugins (haus/kalender): off – MQTT tab, tick “Give calendar days to other plugins”."
HAUS_T_MQTT_AUS = "Calendar days to other plugins (haus/kalender): tick on, but “Publish state via MQTT” is off – nothing goes out."
HAUS_T_NIE = "Calendar days to other plugins (haus/kalender): on – no broker session yet (the next minute run sends)."
HAUS_T_AN = "Calendar days to other plugins (haus/kalender): on – last sent %s, datum=%s, today free=%s, tomorrow free=%s; last session %s: %s"
