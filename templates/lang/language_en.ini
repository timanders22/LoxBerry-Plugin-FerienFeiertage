BS1_KOPF = "Ferien und Feiertage – is the plugin running? Today, tomorrow and the operating modes"
BS1_S1 = "In the plugin tab “Settings” choose country and state (municipality if needed), save, “Fetch now”. Tab “MQTT”: “Publish state via MQTT” is ticked (default for a new installation). Tab “Test”: the self-test is green; “Data” in the header says that today and tomorrow are covered – then ferien_ok = 1 goes out."
BS1_S2 = "Do step 2 in the tab “Loxone integration” (gateway V1: nothing to enter, the plugin brings the subscription ferien/# itself; gateway V2: tick the data points of the tick list). Then create the inputs: either copy the page from the sample project (the inputs come with it) or, following step 3, one Virtual Input per value with exactly the name from the name table (do not activate “Use as digital input”). The LoxBerry user stored for the Miniserver needs rights on the inputs."
BS1_S3 = "Create the page “Ferien und Feiertage”, drag the 19 inputs of the list (no. 1–19) onto it (created after the name table or copied with the page from the sample project), plus the existing “Konstante 1” (no. 20)."
BS1_S4 = "Create two notifications: “Meldung Plugin gestört (Ferien)” and “Meldung Kalenderdaten veralten (Ferien)”, texts as in the list. Create the virtual input “Schulferien als freie Tage (Ferien)” as a switch."
BS1_S5 = "Place the remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value Validator no. 21: remove the tick at ‘En’ in the properties window (Config creates input En inverted; otherwise constant 1 arrives as 0 and the failure message never triggers). Invert input I2 on the AND no. 31 and no. 34: click the input point, after that the input shows a small circle. Status “Heute (Ferien)”: first click “+” four times, “Morgen (Ferien)” three times; lines in the given order, the one without condition last."
BS1_S6 = "Operating modes “Feiertag” (no. 32) and “Freier Tag/Schulferien” (no. 36): click the operating mode in the tree → ribbon ‘Operating Modes’ → ‘Add Output Reference’, then draw the line to this output reference – from no. 31 and no. 35. Do not drag them from the tree – that only gives an input reference. If your timers should not follow public holidays, skip this step."
BS1_S7 = "Save and transfer. Check: “Zustand (Ferien)” shows “läuft – letzter Abruf vor … Tagen”; ferien_status_zaehler counts on every minute; “Heute (Ferien)” matches the calendar."
BS1_H1 = "With the operating mode “Feiertag” connected, every timer with holiday times follows the public holidays by itself: alarm clock, shutters, pre-conditioning, mowing ban. Public holidays then no longer need to be entered in Loxone."
BS1_H2 = "Only switch on “Schulferien als freie Tage” if really everyone is off during the school holidays – otherwise the timers of those who work also switch to “day off”."
BS1_H3 = "In case of a failure no operating mode switches (the ANDs with the inverted input): a stopped LoxBerry does not hold a public holiday. Via MQTT the change of day arrives with the first minute run after midnight; if this one value gets lost in the MQTT gateway, it comes with the next complete set – at the latest 30 minutes later."
BS1_H4 = "If the LoxBerry or the MQTT gateway stops or MQTT is off in the plugin, all inputs keep their last value; only the stopped counter ferien_status_zaehler shows it. The message comes after 10 minutes of failure; if only the sign of life is missing, after about 25 minutes (15 minutes Tmc, then 10 minutes confirmation). Under gateway V2 the shared start block “Gateway nach Neustart neu senden” belongs to it – without it the page reports a false alarm after every restart of the Miniserver until ferien_ok changes."
BS1_H5 = "Half public holidays set the operating mode “Feiertag” for the whole day. If you do not want that, add another AND with inverted ferien_halbtag (no. 7) in front of no. 31."
BS1_H6 = "Deliberately not in the lists, but in the name table: ferien_schulfrei and ferien_morgen_schulfrei (= NOT ferien_schultag), ferien_wochentag and ferien_morgen_wochentag (Loxone knows them itself), ferien_urlaub_letzter_tag (replaced by ferien_urlaub_heim), ferien_morgen_ferien2, ferien_schulfrei2 and ferien_morgen_schulfrei2."
BS2_KOPF = "Ferien und Feiertage Meldungen – evening push, first school day, test push, announcement and countdown"
BS2_S1 = "In the plugin tab “Settings” under “Notifications” tick “Push message active” and/or “Audio output active”, choose the occasions (“Report if tomorrow is no school”, “Report on the evening before the start of holidays”), the reporting time (default 19:00) and the voice output."
BS2_S2 = "Take over the shared output “LoxBerry MQTT-Gateway” from the sample project and create the two commands “Ferien: Ansage jetzt sprechen” (command on ON publish ferien/befehl/ansage 1) and “Ferien: Test-Push auslösen” (publish ferien/befehl/testpush 1) in it – or create the “MQTT commands template” in the tab “Loxone integration” under step 5 and import it under Periphery → Virtual Outputs. In the plugin tab “MQTT” tick “Accept commands via MQTT”."
BS2_S3 = "New page “Ferien und Feiertage Meldungen”, drag the 13 virtual inputs (created after the name table) and the 2 commands of the output “LoxBerry MQTT-Gateway”, plus the existing switch “Niemand zu Hause (eigene Quelle)”."
BS2_S4 = "Create three notifications (“Meldung Morgen frei (Ferien)”, “Meldung Morgen wieder Schule (Ferien)”, “Meldung Test-Push (Ferien)”) and two push buttons (“Taste Ferien-Ansage (Ferien)”, “Taste Test-Push (Ferien)”)."
BS2_S5 = "Remaining blocks via F5. Set “Pulse at” no. 16 to 19:00:00 (the same time as in the plugin). AND no. 24: invert input I2 – click the input point, after that the input shows a small circle. Text Generator no. 21: enter the text. Status “Meldewege (Ferien)” and “Nächste Feiertage (Ferien)”: first click “+” once each, “Ferien-Countdown (Ferien)” twice."
BS2_S6 = "Create the three virtual text inputs with exactly the names of the list (“Use in User Interface” on) and connect them to the status blocks: ferien_name to “Nächste Feiertage (Ferien)” V4, ferien_feiertag_name to V5, ferien_ferien_name to “Ferien-Countdown (Ferien)” V6. Like all values the texts arrive via the MQTT gateway."
BS2_S7 = "Save and transfer. Check: press “Taste Test-Push (Ferien)” – within one minute “Meldung Test-Push (Ferien)” arrives on the phone; in the plugin tab “Test” the command is listed under “Command bridge” with “angenommen”."
BS2_H1 = "Every notification has exactly one source; the messages hang on the digital outputs of the commands – never via a threshold switch: it would give a pulse and thus a message at every incoming value (measured like this in the house, back then every 5 minutes)."
BS2_H2 = "ferien_ann only goes to 1 for the occasions ticked for reporting in the plugin (since 1.2.26). If you want a second trigger for “Meldung Morgen frei”, put an OR in front of the notification."
BS2_H3 = "How and where it is spoken is set in the plugin (shared speech module, tab Settings) – Loxone only triggers. Only with the original Audio Server does Loxone speak itself: then connect the Text Generator no. 21 to your own Audio Server block."
BS2_H4 = "Which occasion tomorrow is shows the status “Morgen (Ferien)” on the first page."
BS2_H5 = "Messages at an AND come again after every transfer as long as the signal is present (for example during the notification window)."
BS3_KOPF = "Ferien und Feiertage Haus – alarm clock, shutters, vacation mode, heating and second region"
BS3_S1 = "In the plugin tab “Settings” under “Custom appointments” enter the vacation periods with the type “Vacation (absent)” (or a calendar subscription), choose the days under “Pre-heating before returning (days)”; for a second child in another state choose the second region."
BS3_S2 = "New page “Ferien und Feiertage Haus”, drag the 12 virtual inputs (ferien_schultag, ferien_freitage, ferien_urlaub, ferien_morgen_urlaub once more), plus the existing switch “Niemand zu Hause (eigene Quelle)”."
BS3_S3 = "Create three switches: “Wecker aktiv (Ferien)”, “Urlaub von Hand (Ferien)”, “Wecker Kind 2 aktiv (Ferien)”."
BS3_S4 = "Remaining blocks via F5; set the two “Pulse at” to 06:45:00 and 08:30:00. AND no. 26: invert input I2 – click the input point, after that the input shows a small circle. Operating modes “Urlaub” (no. 19) and “Anwesenheitssimulation” (no. 20): click the operating mode in the tree → ribbon ‘Operating Modes’ → ‘Add Output Reference’, then draw the line to this output reference – both from no. 18; do not drag them from the tree. Status “Urlaub (Ferien)”: first click “+” three times, “Haus heute (Ferien)” twice."
BS3_S5 = "Connect the outputs no. 10, 16, 18, 26 and 34 to your own devices (alarm clock, shutters, consumers, room control)."
BS3_S6 = "Save and transfer. Check: switch “Urlaub von Hand (Ferien)” on – “Haus heute (Ferien)” shows “Urlaubsmodus …”, the operating mode “Urlaub” is active."
BS3_H1 = "Vacation by hand supplements the calendar; an entered vacation can only be switched off in the plugin (change the period)."
BS3_H2 = "Do not hang anything security-relevant (arming the alarm system) on the calendar alone, but on the real presence."
BS3_H3 = "Set back the heating on days off only with an empty house: whoever is at home wants it warm. Without your own presence leave out no. 21–24 and connect no. 18 directly to no. 26 I1."
BS3_H4 = "The threshold switch “Lange frei” on ferien_freitage is right (real numerical value); the 600 s after it swallow its pulse at every incoming value."
BS3_H5 = "Before the first value all inputs are 0: “Haus heute” then shows “frei”, and the shutters move at 8:30."
