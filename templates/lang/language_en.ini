ERLAEUTERUNG = "<b>On {VI}:</b> Title, address and commands are the same as in the import file under <i>Create everything at once</i>. A number only counts together with OK = 1.<br><b>On {O2}:</b> Never feed the vacation mode directly from URLAUB, always via {O2} – otherwise it cannot be overridden by hand after a short-notice change of plans. Safety-relevant things (arming the alarm system) should <b>not</b> depend on the calendar alone, but also on the real presence detection.<br><b>On {NB1}, {NB2} and {NB3}:</b> Every notification block has exactly one source. A further trigger for {NB1} goes to I2 of {O1}, every additional one via one more OR in front of it (cascade)."

