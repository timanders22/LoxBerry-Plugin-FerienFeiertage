[BEFEHL]

TITEL = "Step 5 – commands from Loxone (MQTT)"
TEXT = "Loxone sends the commands to the UDP input of the MQTT gateway (port %d); the command bridge of the plugin accepts them and calls the same function as the HTTP path (?say=1, ?ptest=1). Under gateway V1 and V2 nothing needs to be entered or ticked for commands. Loxone sends “publish”, never “retain” – a retained command is never executed."
HAKEN_AN = "Accept commands via MQTT: on."
HAKEN_AUS = "Accept commands via MQTT: off – tick it in the tab MQTT, otherwise the command bridge does not run and Loxone reaches nothing."
SP_TITEL = "Title in Loxone"
SP_THEMA = "Topic"
SP_BEFEHL = "Command on ON"
SP_SPERRE = "Lock minute"
SP_QUITTUNG = "Acknowledgement means"
SPERRE = "%d s (the same command with the same value is rejected for that long)"
QUITTUNG_AUSGEFUEHRT = "executed"
QUITTUNG_UEBERGEBEN = "handed over"
K_ANSAGE = "Speak announcement now"
K_TESTPUSH = "Trigger test push"
K_VORLAGE = "Create MQTT commands template"
VORLAGE_H = "The template creates an own output “Ferien und Feiertage MQTT-Befehle” in Loxone Config (Periphery → Virtual Outputs, address /dev/udp/<LoxBerry>/<UDP port>). In the sample project the same two commands are on the shared output “LoxBerry MQTT-Gateway” (“Ferien: Ansage jetzt sprechen”, “Ferien: Test-Push auslösen”) – if you already have that one, you do not need this template."
QUITTUNG_H = "The answer is on <topic>/quittung (“angenommen” or “abgelehnt: …”), never retained; it is meant for the tab Test and the log, not for Loxone. Sign of life of the bridge: %s (1 = running, 0 = off, -1 = error), every minute, never retained."
NICHT_LADBAR = "The command bridge cannot be loaded: %s"
