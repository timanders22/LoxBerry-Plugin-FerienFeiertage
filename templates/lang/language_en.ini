ICS_ERKLAERUNG = "Instead of maintaining the six rows below by hand, the plugin can subscribe to a calendar; Google, Nextcloud and iCloud all provide one. Only <b>all-day events</b> are used. Timed events and repeating events are skipped, because this plugin works in whole days. The last successfully read state is kept if the calendar is temporarily unreachable."
