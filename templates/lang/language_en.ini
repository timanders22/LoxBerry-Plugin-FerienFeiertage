BRUECKENMODUS = "Detection of bridge days"
BM_KLASSISCH = "Classic: Friday after a Thursday holiday, Monday before a Tuesday holiday"
BM_ERWEITERT = "Extended: also working days between two blocks of days off"
BM_H = "The classic mode is the default and stays the default after an update: BRUECKE goes to the Miniserver, where it usually drives a threshold switch. The extended mode additionally finds the days between Christmas and New Year, which the classic mode misses entirely."
LUECKE = "Maximum gap (working days)"
LUECKE_H = "Measured: a value of 3 excludes the days between Christmas and New Year, because those are four working days. More than 4 is not possible: an ordinary week has five working days, so everything would become a bridge."
VORLAUF = "Pre-heating before returning (days)"
VORLAUF_H = "URLAUBHEIM switches to 1 this many days before the holiday ends. URLAUBENDE only changes on the last day, and a house that starts heating then is cold on arrival. Use 0 to switch the value off."
TYP_STRENG = "Count only genuine public holidays"
TYP_STRENG_H = "The data source distinguishes Public, Bank and Optional holidays, and School from EndOfLessons. Without this option everything counts the same. It makes no difference for Germany and Austria; in Luxembourg Good Friday is a bank holiday and therefore not a general day off, and Switzerland has optional days. The option is off by default so that nothing changes by itself after an update. With the second option, half-day holidays keep counting as a full day off, as before."
HALBTAG_FREI = "Count half-day holidays as a full day off"
