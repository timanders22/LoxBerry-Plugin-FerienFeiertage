VORTEXT = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. If you only want public holidays and school holidays for your timers, take over the first one alone; each further page stands on its own (no connection crosses a page boundary). All values arrive via the MQTT gateway; the names of the virtual inputs and text inputs follow the MQTT prefix set, “%s”."
KACHELN = "For the app the status blocks of the three pages are enough (each with “visualisation ON”): “Zustand (Ferien)”, “Heute (Ferien)”, “Morgen (Ferien)”, “Meldewege (Ferien)”, “Ferien-Countdown (Ferien)”, “Nächste Feiertage (Ferien)”, “Urlaub (Ferien)”, “Haus heute (Ferien)” and “Zweite Region (Ferien)”. If you want a single number as a tile (e.g. ferien_ferien_in), use the input itself and set the unit “<v.0> Tage” there."

