; Texte, die mit Fassung 1.2.0 dazugekommen sind.
SPRACHE_NAMEN = "Language of holiday names"
SPRACHE_NAMEN_H = "Applies to the names coming from the data source, not to this interface. The data is fetched again after a change."
REGION2 = "Second region (school holidays only)"
REGION2_AUS = "no second region"
REGION2_H = "For a household with children in two federal states. It provides its own group of values to Loxone (FERIEN2, SCHULTAG2 and so on). Public holidays are deliberately fetched only once: they depend on where you live, not on which school you attend."
SCHULART = "Type of school"
