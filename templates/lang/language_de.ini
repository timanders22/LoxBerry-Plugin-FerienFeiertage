BS1_KOPF = "Ferien und Feiertage – läuft das Plugin? Heute, morgen und die Betriebsmodi"
BS1_S1 = "Im Plugin Reiter „Einstellungen“ Land und Bundesland wählen (bei Bedarf Gemeinde), speichern, „Jetzt abrufen“. Reiter „Test“: die Selbstprüfung ist grün, die Loxone-Zeile beginnt mit FERIEN;OK=1."
BS1_S2 = "Oben unter „Alles auf einmal anlegen“ auf „Vorlage für Loxone Config erzeugen“ klicken. In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren. Nur EINMAL einlesen (zweimal ergibt doppelte Eingänge). Der Behälter „Ferien und Feiertage“ dient allen drei Seiten."
BS1_S3 = "Seite „Ferien und Feiertage“ anlegen, die 19 Befehle der Liste (Nr. 1–19) aus dem Behälter ziehen, dazu die vorhandene „Konstante 1“ (Nr. 20)."
BS1_S4 = "Zwei Benachrichtigungen anlegen: „Meldung Plugin gestört (Ferien)“ und „Meldung Kalenderdaten veralten (Ferien)“, Texte wie in der Liste. Den Virtuellen Eingang „Schulferien als freie Tage (Ferien)“ als Schalter anlegen."
BS1_S5 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 21: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an und die Störmeldung löst nie aus). An den UND Nr. 31 und Nr. 34 den Eingang I2 negieren: auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Heute (Ferien)“: vorher viermal auf „+“ klicken, „Morgen (Ferien)“ dreimal; Zeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt."
BS1_S6 = "Betriebsmodi „Feiertag“ (Nr. 32) und „Freier Tag/Schulferien“ (Nr. 36): Betriebsmodus im Baum anklicken → Menüband ‚Betriebsmodi‘ → ‚Ausgangsreferenz einfügen‘, dann die Leitung auf diese Ausgangsreferenz – von Nr. 31 bzw. Nr. 35. Nicht aus dem Baum ziehen – das ergibt nur einen Eingangsverweis. Wer seine Schaltuhren nicht nach Feiertagen richten will, lässt diesen Schritt weg."
BS1_S7 = "Speichern und übertragen. Probe: „Zustand (Ferien)“ zeigt „läuft – letzter Abruf vor … Tagen“; FERIEN_ZAEHLER zählt mit jeder Abfrage weiter; „Heute (Ferien)“ stimmt mit dem Kalender."
BS1_H1 = "Ist der Betriebsmodus „Feiertag“ angeschlossen, richtet sich jede Schaltuhr mit Feiertags-Zeiten von selbst nach den Feiertagen: Wecker, Rollladen, Vorklimatisieren, Mähverbot. Feiertage muss man in Loxone dann nicht mehr eintragen."
BS1_H2 = "„Schulferien als freie Tage“ nur einschalten, wenn in den Ferien wirklich alle frei haben – sonst schalten auch die Schaltuhren der Berufstätigen auf „freier Tag“."
BS1_H3 = "Bei Störung schaltet kein Betriebsmodus (die UND mit negiertem Eingang): ein stehender LoxBerry hält keinen Feiertag fest."
BS1_H4 = "Steht der LoxBerry, behalten alle Eingänge ihren letzten Wert; nur der stehende Zähler FERIEN_ZAEHLER verrät es. Die Meldung kommt nach 10 Minuten Störung; fehlt nur das Lebenszeichen, nach etwa 25 Minuten (15 Minuten Tmc, dann 10 Minuten Bestätigung)."
BS1_H5 = "Halbe Feiertage setzen den Betriebsmodus „Feiertag“ ganztags. Wer das nicht will, legt vor Nr. 31 ein weiteres UND mit negiertem FERIEN_HALBTAG (Nr. 7)."
BS1_H6 = "Bewusst nicht in den Listen, aber in der Vorlage: SCHULFREI und MSCHULFREI (= NICHT SCHULTAG), WOCHENTAG und MWOCHENTAG (kennt Loxone selbst), URLAUBENDE (ersetzt durch URLAUBHEIM), MFERIEN2, SCHULFREI2 und MSCHULFREI2."
BS2_KOPF = "Ferien und Feiertage Meldungen – Vorabend-Push, erster Schultag, Test-Push, Ansage und Countdown"
BS2_S1 = "Im Plugin Reiter „Einstellungen“ unter „Benachrichtigungen“ „Push-Nachricht aktiv“ und/oder „Audioausgabe aktiv“ anhaken, die Anlässe („Melden, wenn morgen schulfrei ist“, „Melden am Vorabend des Ferienbeginns“), die Meldezeit (ab Werk 19:00) und die Sprachausgabe wählen."
BS2_S2 = "Oben unter „Alles auf einmal anlegen“ auf „Ausgangsvorlage erzeugen (Ansage und Test-Push)“ klicken und in Config unter Peripherie → Virtuelle Ausgänge importieren – Adressen und Aktionstoken stehen schon darin. Nur einmal einlesen; nach „Neues Token erzeugen“ neu einlesen."
BS2_S3 = "Neue Seite „Ferien und Feiertage Meldungen“, die 13 Befehle aus „Ferien und Feiertage“ und die 2 Befehle aus „Ferien und Feiertage Aktionen“ ziehen, dazu den vorhandenen Schalter „Niemand zu Hause (eigene Quelle)“."
BS2_S4 = "Drei Benachrichtigungen anlegen („Meldung Morgen frei (Ferien)“, „Meldung Morgen wieder Schule (Ferien)“, „Meldung Test-Push (Ferien)“) und zwei Tasten („Taste Ferien-Ansage (Ferien)“, „Taste Test-Push (Ferien)“)."
BS2_S5 = "Übrige Bausteine über F5. „Impuls um“ Nr. 16 auf 19:00:00 stellen (dieselbe Zeit wie im Plugin). UND Nr. 24: Eingang I2 negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Text Generator Nr. 21: Text eintragen. Status „Meldewege (Ferien)“ und „Ferien-Countdown (Ferien)“: vorher je einmal auf „+“ klicken."
BS2_S6 = "Nur mit MQTT: im Plugin Reiter „MQTT“ „Zustand per MQTT veröffentlichen“ anhaken; im LoxBerry-MQTT-Gateway ferien/# abonnieren (ab Gateway V2 erscheint die Gruppe von selbst). Die drei Virtuellen Texteingänge mit genau den Namen der Liste anlegen. Ohne MQTT Nr. 31–33 weglassen."
BS2_S7 = "Speichern und übertragen. Probe: „Taste Test-Push (Ferien)“ drücken – innerhalb von 5 Minuten kommt „Meldung Test-Push (Ferien)“ aufs Handy."
BS2_H1 = "Jede Benachrichtigung hat genau eine Quelle; die Meldungen hängen an den digitalen Ausgängen der Befehle – nie über einen Schwellwertschalter: der gäbe bei jeder Abfrage einen Impuls und damit alle 5 Minuten eine Meldung (so im Haus gemessen)."
BS2_H2 = "FERIEN_ANN geht nur für die Anlässe auf 1, die im Plugin zum Melden angehakt sind (seit 1.2.26). Wer einen zweiten Auslöser für „Meldung Morgen frei“ will, setzt ein ODER vor die Benachrichtigung."
BS2_H3 = "Wie und wo gesprochen wird, stellt man im Plugin ein (gemeinsames Sprachmodul, Reiter Einstellungen) – Loxone löst nur aus. Nur beim Original-Audioserver spricht Loxone selbst: dann den Text Generator Nr. 21 an den eigenen Audioserver-Baustein hängen."
BS2_H4 = "Welcher Anlass morgen ist, steht im Status „Morgen (Ferien)“ auf der ersten Seite."
BS2_H5 = "Meldungen an einem UND kommen nach jedem Übertragen erneut, solange das Signal anliegt (zum Beispiel während des Meldefensters)."
BS3_KOPF = "Ferien und Feiertage Haus – Wecker, Rollladen, Urlaubsmodus, Heizung und zweite Region"
BS3_S1 = "Im Plugin Reiter „Einstellungen“ unter „Eigene Termine“ die Urlaubszeiträume mit der Art „Urlaub (abwesend)“ eintragen (oder ein Kalender-Abonnement), unter „Vorwärmen vor der Rückkehr (Tage)“ die Tage wählen; bei einem zweiten Kind in einem anderen Bundesland die zweite Region wählen."
BS3_S2 = "Neue Seite „Ferien und Feiertage Haus“, die 12 Befehle ziehen (SCHULTAG, FREITAGE, URLAUB, MURLAUB ein weiteres Mal), dazu den vorhandenen Schalter „Niemand zu Hause (eigene Quelle)“."
BS3_S3 = "Drei Schalter anlegen: „Wecker aktiv (Ferien)“, „Urlaub von Hand (Ferien)“, „Wecker Kind 2 aktiv (Ferien)“."
BS3_S4 = "Übrige Bausteine über F5; die zwei „Impuls um“ auf 06:45:00 und 08:30:00. UND Nr. 26: Eingang I2 negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Betriebsmodi „Urlaub“ (Nr. 19) und „Anwesenheitssimulation“ (Nr. 20): Betriebsmodus im Baum anklicken → Menüband ‚Betriebsmodi‘ → ‚Ausgangsreferenz einfügen‘, dann die Leitung auf diese Ausgangsreferenz – beide von Nr. 18; nicht aus dem Baum ziehen. Status „Urlaub (Ferien)“: vorher dreimal auf „+“ klicken, „Haus heute (Ferien)“ zweimal."
BS3_S5 = "Die Ausgänge Nr. 10, 16, 18, 26 und 34 an die eigenen Geräte legen (Wecker, Rollläden, Verbraucher, Raumregelung)."
BS3_S6 = "Speichern und übertragen. Probe: Schalter „Urlaub von Hand (Ferien)“ ein – „Haus heute (Ferien)“ zeigt „Urlaubsmodus …“, der Betriebsmodus „Urlaub“ ist aktiv."
BS3_H1 = "Urlaub von Hand ergänzt den Kalender; ausschalten lässt sich ein eingetragener Urlaub nur im Plugin (Zeitraum ändern)."
BS3_H2 = "Sicherheitsrelevantes (Alarmanlage scharf) nicht allein an den Kalender hängen, sondern an die echte Anwesenheit."
BS3_H3 = "Heizung absenken an freien Tagen nur bei leerem Haus: wer zu Hause ist, will es warm. Ohne eigene Anwesenheit Nr. 21–24 weglassen und Nr. 18 direkt an Nr. 26 I1."
BS3_H4 = "Der Schwellwertschalter „Lange frei“ an FREITAGE ist richtig (echter Zahlenwert); die 600 s danach schlucken seinen Impuls bei jeder Abfrage."
BS3_H5 = "Vor der ersten Abfrage stehen alle Befehle auf 0: „Haus heute“ zeigt dann „frei“, und der Rollladen fährt um 8:30."
