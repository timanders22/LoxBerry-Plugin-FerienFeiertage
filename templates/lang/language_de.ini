MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
VORTEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Wer nur Feiertage und Ferien für seine Schaltuhren will, übernimmt die erste allein; jede weitere Seite steht für sich (keine Leitung geht über eine Seitengrenze). Die Namen der Virtuellen Texteingänge folgen dem eingestellten MQTT-Präfix „%s“."
KACHELN = "Für die App reichen die Status der drei Seiten (je mit „Visualisierung EIN“): „Zustand (Ferien)“, „Heute (Ferien)“, „Morgen (Ferien)“, „Meldewege (Ferien)“, „Ferien-Countdown (Ferien)“, „Nächste Feiertage (Ferien)“, „Urlaub (Ferien)“, „Haus heute (Ferien)“ und „Zweite Region (Ferien)“. Wer eine einzelne Zahl als Kachel will (z. B. FERIEN_FERIENIN), nimmt den Befehl selbst – die Vorlage trägt schon die Einheit „<v.0> Tage“."

